    <script>
      (function () {
        try {
          var cursor = window;
          var desc = null;
          while (cursor) {
            desc = Object.getOwnPropertyDescriptor(cursor, 'fetch');
            if (desc) break;
            cursor = Object.getPrototypeOf(cursor);
          }
          if (desc && desc.get && !desc.set) {
            var ownDesc = Object.getOwnPropertyDescriptor(window, 'fetch');
            if (!ownDesc || ownDesc.configurable) {
              var currentFetch = window.fetch;
              Object.defineProperty(window, 'fetch', {
                configurable: true,
                enumerable: true,
                get: function () {
                  return currentFetch;
                },
                set: function (nextFetch) {
                  currentFetch = nextFetch;
                },
              });
            }
          }
        } catch (_err) {
          // Ignore non-configurable fetch descriptors in restricted sandboxes
        }

        window.addEventListener(
          'error',
          function (event) {
            var filename = (event && event.filename) || '';
            var message = (event && event.message) || '';
            if (
              filename.indexOf('chrome-extension://') === 0 &&
              message.indexOf('Cannot set property fetch') !== -1
            ) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          },
          true,
        );
      })();
    </script>
